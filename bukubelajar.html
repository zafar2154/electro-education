    <div class="container">
        <div class="page-content">
            <div class="row">
                <div class="featured-games header-text">
                    <form class="filter">
                        <div class="col-lg-12">
                            <div class="row">
                                <div style="width: 100%">
                                    <div class="item cari">
                                        <label></label>
                                        <input name="name" type="text" placeholder="Cari Buku Disini">
                                        <div class="item submit" style="width:30%" style="background-color: purple;">
                                            <button>Cari</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-3" style="margin-top: 10px;">
                                    <div class="item fil">
                                        <label>Kelas</label>
                                        <select name="kelas">
                                        <option value="">Semua</option>
                                        <option value="satu">I</option>
                                        <option value="dua">II</option>
                                        <option value="tiga">III</option>
                                        <option value="empat">IV</option>
                                        <option value="lima">V</option>
                                        <option value="enam">VI</option>
                                        <option value="tujuh">VII</option>
                                        <option value="delapan">VIII</option>
                                        <option value="sembilan">IX</option>
                                        <option value="sepuluh">X</option>
                                        <option value="sebelas">XI</option>
                                        <option value="duabelas">XII</option>
                                    </select>
                                    </div>
                                </div>

                                <div class="col-lg-4" style="margin-top: 10px;">
                                    <div class="item fil">
                                        <label>Jenjang</label>
                                        <select name="jenjang">
                                        <option value="">Semua</option>
                                        <option value="sd">SD/MI</option>
                                        <option value="smp">SMP/MTS</option>
                                        <option value="sma">SMA/MA/SMK/MAK</option>
                                    </select>
                                    </div>
                                </div>

                                <div class="col-lg-5" style="margin-top: 10px;">
                                    <div class="item fil">
                                        <label>Mata Pelajaran</label>
                                        <select name="pelajaran">
                                        <option value="">Semua</option>
                                        <option value="tema">Tema</option>
                                        <option value="ipa">IPA</option>
                                        <option value="ips">IPS</option>
                                        <option value="indonesia">Bahasa Indonesia</option>
                                        <option value="inggris">Bahasa Inggris</option>
                                        <option value="matematika">Matematika</option>
                                        <option value="pkn">Pendidikan Kewarganegaraan</option>
                                        <option value="pjok">PJOK</option>
                                        <option value="prakarya">Prakarya</option>
                                        <option value="islam">Pendidikan Agama Islam</option>
                                        <option value="kristen">Pendidikan Agama Kristen</option>
                                        <option value="katolik">Pendidikan Agama Katolik</option>
                                        <option value="hindu">Pendidikan Agama Hindu</option>
                                        <option value="buddha">Pendidikan Agama Buddha</option>
                                        <option value="khonghucu">Pendidikan Agama Khonghucu</option>
                                    </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                    <div class="countResults">Menemukan <b id="count"></b> Buku </div>
                    <div id="list"></div>
                    <div class="pagination" id="pagination"></div>
